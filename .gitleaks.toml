# gitleaks 配置 · 夜猫看台
#
# 背景：2026-11-04 复核发现 `23e47a3` / `ce883ca` / `79f3aa4` 的 `server/scraper.js`
# 曾内联第三方直播直链，参数含 SecurityKey / encrypt / timestamp / userid（个人会话签名）。
# `56f0c0d` 已把直链外置到 gitignore 的 `server/tv-channels.local.json`，但历史仍可读。
#
# 本配置的职责：不再让同类内容进仓库。历史清洗是另一件事（需 force-push，单独执行）。

title = "nightowl-web"

[extend]
# 保留 gitleaks 内置规则（AWS / GitHub PAT / 私钥 等）
useDefault = true

[[rules]]
id = "nightowl-signed-live-url"
description = "带会话签名的直播直链（SecurityKey / encrypt 参数）"
# 形如 https://host/path?channel=x&timestamp=...&SecurityKey=<32 hex>&encrypt=<32 hex>
regex = '''https?://[^\s"'`<>]{10,}?[?&](?:SecurityKey|securityKey|encrypt|Encrypt)=[A-Za-z0-9%._-]{8,}'''
tags = ["secret", "signed-url"]

[[rules]]
id = "nightowl-userid-in-url"
description = "URL 内嵌 userid / deviceid 等个人标识"
regex = '''https?://[^\s"'`<>]{10,}?[?&](?:userid|userId|deviceid|deviceId|uid)=[A-Za-z0-9%._-]{6,}'''
tags = ["pii"]

[[rules]]
id = "nightowl-tv-channels-inline"
description = "保底频道直链被写回源码（应放 tv-channels.local.json）"
# 命中 scraper.js / rules.json 里出现的长直链 + m3u8/playlist 特征
regex = '''https?://[^\s"'`<>]{20,}/(?:live|playlist|hls)[^\s"'`<>]*\.m3u8'''
# ⚠️ 路径正则走 RE2，不支持负向前瞻 (?!...) —— 写了会让 gitleaks 配置加载直接 panic，
#    表现为「workflow 9 秒失败、没有 results.sarif」。排除模板文件交给下方 allowlist.paths。
path = '''(?:^|/)server/[^/]*\.(?:js|json|mjs)$'''
tags = ["secret", "signed-url"]

[allowlist]
# 已知历史泄漏：23e47a3 的 server/scraper.js 内联过带签名的直播直链（2 处）。
# 56f0c0d 已外置到 gitignore 的文件，但历史仍可读 —— 清洗需要 force-push，属未完成项（H1）。
# 这里显式豁免该提交，让门禁只对「新发生的泄漏」报警，而不是长期红着没人看。
commits = ["23e47a3d3d17b2b2eca8cb3e9a126bc50369a136"]

description = "允许出现的公开地址与模板"
paths = [
  # 模板文件（只有占位符，不含真实签名）
  '''server/tv-channels\.example\.json''',
  # 公开上游与官方平台首页 / 搜索模板
  '''server/watch-sources\.json''',
  # 测试固件里刻意构造的假 URL
  '''tools/test-.*\.mjs''',
  '''spike/.*'''
]
regexes = [
  # 文档里说明背景时引用的特征词（不带真实值）
  '''SecurityKey=\<[^>]*\>''',
  # 公开 CDN / 官方域名，不带签名
  '''https?://(?:www\.)?(?:miguvideo|qq|youku|iqiyi|bilibili)\.com'''
]
