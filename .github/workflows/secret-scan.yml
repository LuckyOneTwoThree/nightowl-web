name: secret-scan

# 隐私门禁：防止带会话签名的直播直链 / 个人标识再次入库。
#
# 背景：历史提交 23e47a3 / ce883ca / 79f3aa4 的 server/scraper.js 曾内联第三方
# 直播直链（SecurityKey / encrypt / timestamp / userid）。56f0c0d 已外置，
# 但需要一道门禁保证不再发生。
#
# 两道检查：
#   1. 本地同款脚本（工作区，零依赖）
#   2. gitleaks（扫 git 历史 + 工作区，规则见 .gitleaks.toml）
#
# 注意：本 workflow 只做检测，不修改任何东西；历史清洗需人工 force-push。

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action 需要读 PR 的提交范围
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 必须取全历史，否则 gitleaks 只能看到最后一次提交
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 工作区隐私检查（零依赖）
        run: node tools/check-secrets.mjs

      - name: gitleaks（历史 + 工作区）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 使用仓库内的 .gitleaks.toml
          GITLEAKS_CONFIG: .gitleaks.toml
