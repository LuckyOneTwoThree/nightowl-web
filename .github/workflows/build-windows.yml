name: build-windows

# 夜猫看台 · Windows 桌面包
#
# 触发方式：
#   1. Actions 页面手动 Run workflow（workflow_dispatch）
#   2. 推送 v* 标签（正式发版）
#
# 产物：NSIS 安装包（NightOwl-Terace-Setup-<version>.exe），在 Artifact 里下载。
# 说明：本地单机应用、不对外分发，**不做代码签名** —— Windows SmartScreen 会提示
#       「未知发布者」，属预期行为；给用户的话术是「仍要运行」。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    # GITHUB_TOKEN 默认只读；创建 Release / 上传附件需要 contents 的写权限
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        # 打包前先证明代码是好的；scraper 两项依赖外网，
        # 在 CI 环境不稳定，单独放行（test:all 里它们排最后，失败不影响前面的验证）
        shell: bash
        run: |
          npm run verify:algo
          npm run test:m3u8
          npm run test:proxy
          npm run test:proxy-timeout
          npm run test:playback
          npm run test:media
          npm run test:scraper-match
          npm run test:session
          npm run test:scores
          npm run test:owl
          npm run test:alias
          npm run test:stats

      - name: Package Windows (NSIS)
        run: npx electron-builder --win --publish never

      # 打包后自检（两道）：
      # ① 相对 import 扫描 —— 逐一解析产物内 server/electron 模块的相对 import，
      #    目标文件必须存在。曾靠它本应抓到「scores.js → ../src/core/engine.js 未打包」，
      #    人工枚举清单漏了这一条，导致安装包在用户机上才暴雷。
      # ② 关键文件补充断言。
      - name: Verify packaged files
        shell: pwsh
        run: |
          $root = 'release/win-unpacked/resources/app'
          $missing = @()
          $scan = @(Get-ChildItem "$root/server" -Recurse -Filter *.js)
          $scan += @(Get-ChildItem "$root/electron" -Filter *.cjs)
          foreach ($f in $scan) {
            $text = Get-Content $f.FullName -Raw
            $refs = [regex]::Matches($text, "from '(\.[^']+)'")
            $refs += [regex]::Matches($text, "import\('(\.[^']+)'\)")
            foreach ($m in $refs) {
              $rel = $m.Groups[1].Value
              $target = [IO.Path]::GetFullPath((Join-Path $f.DirectoryName $rel))
              if (-not (Test-Path $target)) {
                $missing += ("{0} -> {1}" -f $f.FullName.Substring($root.Length + 1), $rel)
              }
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error ("相对 import 缺失目标:`n" + ($missing -join "`n"))
            exit 1
          }
          # build/icon.ico 是打包的输入资源（生成 exe 图标），不会出现在产物内 —— 只在仓库中断言
          if (-not (Test-Path 'build/icon.ico')) { Write-Error '缺失: build/icon.ico（打包输入）'; exit 1 }
          foreach ($f in @('src/core/engine.js', 'src/data/fixtures.json', 'dist/index.html')) {
            if (-not (Test-Path (Join-Path $root $f))) { Write-Error "缺失: $f"; exit 1 }
          }
          Write-Host ("OK 相对 import 全部可解析（扫描 {0} 个模块），关键文件齐全" -f $scan.Count)

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: nightowl-windows-setup
          path: release/*.exe
          if-no-files-found: error

      # tag 触发时把安装包发布成 **GitHub Release**：
      # Artifact 只有登录且有权的人能下载，Release 附件任何人（免登录）都能下 ——
      # 「其他用户拿安装包」必须走这里，Artifact 只作为构建产物备份。
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          body: |
            ## 夜猫看台 · Windows 安装包

            ### 安装
            1. 下载下方 `NightOwl-Terrace-Setup-*.exe`，双击安装（可自选目录）
            2. 首次运行如出现 SmartScreen「已保护你的电脑」：点 **更多信息 → 仍要运行**（未做代码签名，属预期行为）

            ### 内置能力
            - 观赛决策（今晚之选 / 本周规划 / 睡眠档位 / 雷区预警，内置赛季快照）
            - 直播源自动抓取 + 本地流代理；官方平台直达；粘贴直链播放
