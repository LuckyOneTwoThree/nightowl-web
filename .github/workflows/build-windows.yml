name: build-windows

# 夜猫看台 · Windows 桌面包
#
# 触发方式：
#   1. Actions 页面手动 Run workflow（workflow_dispatch）
#   2. 推送 v* 标签（正式发版）
#
# 产物：NSIS 安装包（NightOwl-Terace-Setup-<version>.exe），在 Artifact 里下载。
# 说明：本地单机应用、不对外分发，**不做代码签名** —— Windows SmartScreen 会提示
#       「未知发布者」，属预期行为；给用户的话术是「仍要运行」。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    # GITHUB_TOKEN 默认只读；创建 Release / 上传附件需要 contents 的写权限
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 把 tag 版本同步进 package.json —— 前端 __APP_VERSION__ 与 electron-builder
      # 的包元数据都从它读取。此前只用 extraMetadata 改包元数据，package.json 不动，
      # 于是界面显示旧版本（实测：装的是 v0.1.9，界面写着 v0.1.3）。
      - name: Sync version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build frontend
        run: npm run build

      - name: Run tests
        # test:all 现在只跑离线套件（不联网、不写盘），CI 与本地共用同一份门禁。
        # 需要真实上游的检查（test:online）不在 CI 里跑，避免网络波动造成假红。
        shell: bash
        run: npm run test:all

      # v0.1.25 曾出现「构建与 Node 测试全过、生产首屏 ReferenceError 黑屏」。
      # 用无头 Electron 加载真实 dist，断言根节点已渲染且无致命 console 错误。
      - name: Render smoke (headless Electron)
        shell: bash
        run: npm run check:render

      # 注入 tag 版本到包元数据：exe 文件名（artifactName 的 ${version}）随 tag 对齐，
      # 否则 package.json 里的 version 不动，文件名会一直停在旧版本号
      # 注入 tag 版本到包元数据：exe 文件名（artifactName 的 ${version}）随 tag 对齐。
      # ⚠️ 必须保留 --publish never：本工作流的发布职责归下面的 softprops/action-gh-release。
      #    若去掉它并注入 GH_TOKEN，electron-builder 会凭 package.json 的 publish 配置
      #    自己再发一次 Release（同一 tag 双重发布、互相覆盖）。
      #    latest.yml / blockmap 是构建产物，--publish never 下照样生成，由后续步骤一并上传。
      - name: Package Windows (NSIS)
        shell: bash
        run: npx electron-builder --win --publish never -c.extraMetadata.version="${GITHUB_REF_NAME#v}"

      # 打包后自检（两道）：与本地共用同一份跨平台脚本 tools/verify-package.mjs ——
      # 验证逻辑本身必须能在开发环境（mac）执行，否则自检的 bug 只能到 CI 才发现
      - name: Verify packaged files
        run: node tools/verify-package.mjs release/win-unpacked/resources/app

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: nightowl-windows-setup
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

      # tag 触发时把安装包与自动更新元数据发布成 **GitHub Release**：
      # Artifact 只有登录且有权的人能下载，Release 附件任何人（免登录）都能下 ——
      # electron-updater 依赖 latest.yml 比对版本并拉取更新包与差量 blockmap。
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          body: |
            ## 夜猫看台 · Windows 安装包

            ### 本次更新（v0.1.39）
            - **暗夜单一主题**
              - 移除「日间演播室」浅色主题及其入口，默认且只保留暗色演播台；旧版本残留的 light 偏好会被忽略
              - 色彩对比度门禁收敛为暗色 26 项，全部通过 WCAG AA (4.5:1)
            - **赛程与周计划修复**
              - 修复赛程筛选层两个开关无标题、点击无反应：新增整行可点击的开关字段，补全说明、禁用态与 Esc 关闭/焦点归还
              - 赛程列表与「零成本顺带」的未开赛行正确显示夜猫指数，不再重复「未开赛」
              - 切换日期、搜索/联赛筛选、周计划 Tab 或单晚筛选时，列表回到顶部
              - 周计划 Tab 计数与列表实际数量一致；单晚筛选后计数同步收窄，不再静默截断雷区
            - **交互与首启流程**
              - 「情报 / 查看线路 / 看回顾 / 看集锦」在目标已可见时也会高亮并交出焦点，不再出现「点了没反应」
              - 已选中的 Hero 主按钮改为直达赛前情报 / 直播线路 / 赛后回顾，不再空动作
              - 设置、积分榜、命令面板、更新弹窗关闭后焦点回到原触发按钮；更新弹窗打开时下层设置退出焦点
              - 首次启动时开屏与引导按顺序交接，引导结束/跳过/按 Esc 都会写入完成标记；重新引导回到第 1 步
              - 设置「恢复默认」增加二次确认；Mac 快捷键提示统一为 ⌘K
              - 1120 宽度下单条直播线路占满行宽，不再只占半行
            - **验证**
              - 全套离线测试 718/718（含 `test:contrast` 26/26）通过
              - 生产构建与 Electron 多视口（1440 / 1366 / 1120）渲染冒烟 52/52 通过
              - 手机端共享层同步校验与 TypeScript 检查通过

            > 手机端（APK）本次未重新打包；如需同步桌面端修复，请重新安装最新内测包。

            ### 安装
            1. 下载下方 `NightOwl-Terrace-Setup-*.exe`，双击安装（可自选目录）
            2. 首次运行如出现 SmartScreen「已保护你的电脑」：点 **更多信息 → 仍要运行**（未做代码签名，属预期行为）

            ### 内置能力
            - 观赛决策（今晚之选 / 本周规划 / 睡眠档位 / 雷区预警，内置赛季快照）
            - 直播源自动抓取 + 本地流代理；官方平台直达；粘贴直链播放
