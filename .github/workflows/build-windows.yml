name: build-windows

# 夜猫看台 · Windows / macOS 桌面包
#
# 触发方式：
#   1. Actions 页面手动 Run workflow（workflow_dispatch）
#   2. 推送 v* 标签（正式发版）
#
# 产物：Windows NSIS 安装包 + macOS arm64 DMG/ZIP（Apple Silicon）
# 说明：本地单机应用、不对外分发，**不做正式代码签名** —— Windows SmartScreen / macOS
#       Gatekeeper 会提示「未知发布者」，属预期行为；安装说明里给出绕过方式。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    # GITHUB_TOKEN 默认只读；创建 Release / 上传附件需要 contents 的写权限
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tag 触发时把 tag 版本同步进 package.json —— 前端 __APP_VERSION__ 与 electron-builder
      # 的包元数据都从它读取。手动 Run workflow（ref=main）没有 tag 版本，沿用 package.json，
      # 否则 npm version "main" 会直接失败。
      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build frontend
        run: npm run build

      - name: Run tests
        # test:all 现在只跑离线套件（不联网、不写盘），CI 与本地共用同一份门禁。
        # 需要真实上游的检查（test:online）不在 CI 里跑，避免网络波动造成假红。
        shell: bash
        run: npm run test:all

      # v0.1.25 曾出现「构建与 Node 测试全过、生产首屏 ReferenceError 黑屏」。
      # 用无头 Electron 加载真实 dist，断言根节点已渲染且无致命 console 错误。
      - name: Render smoke (headless Electron)
        shell: bash
        run: npm run check:render

      # 注入 tag 版本到包元数据：exe 文件名（artifactName 的 ${version}）随 tag 对齐，
      # 否则 package.json 里的 version 不动，文件名会一直停在旧版本号
      # 注入 tag 版本到包元数据：exe 文件名（artifactName 的 ${version}）随 tag 对齐。
      # ⚠️ 必须保留 --publish never：本工作流的发布职责归下面的 softprops/action-gh-release。
      #    若去掉它并注入 GH_TOKEN，electron-builder 会凭 package.json 的 publish 配置
      #    自己再发一次 Release（同一 tag 双重发布、互相覆盖）。
      #    latest.yml / blockmap 是构建产物，--publish never 下照样生成，由后续步骤一并上传。
      - name: Package Windows (NSIS)
        shell: bash
        run: npx electron-builder --win --publish never -c.extraMetadata.version="$VERSION"

      # 打包后自检（两道）：与本地共用同一份跨平台脚本 tools/verify-package.mjs ——
      # 验证逻辑本身必须能在开发环境（mac）执行，否则自检的 bug 只能到 CI 才发现
      - name: Verify packaged files
        run: node tools/verify-package.mjs release/win-unpacked/resources/app

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: nightowl-windows-setup
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

      # tag 触发时把安装包与自动更新元数据发布成 **GitHub Release**：
      # Artifact 只有登录且有权的人能下载，Release 附件任何人（免登录）都能下 ——
      # electron-updater 依赖 latest.yml 比对版本并拉取更新包与差量 blockmap。
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          body: |
            ## 夜猫看台 · Windows / macOS 安装包

            ### 本次更新（v0.1.49）· 视觉与交互收敛
            自 v0.1.48 起，围绕「少盒子、强层级、安静表面」做了一轮全界面 UI 审查与修复，不改变算法和数据口径。

            - **今晚**
              - 同开球展开后左栏整体滚动，Hero 不再被压缩或截断；展开列表自身不产生第二层滚动
              - `展示中` 行改用 inset ring，描边不再被滚动容器裁掉
              - Hero 去掉重复睡眠数字、空能量条与冗余提示；决策条收敛为「结论 + 结束 / 睡眠代价 / 同夜替代」
              - 长队名最多两行完整显示，不再只剩省略号
            - **设置 / 首次引导**
              - 球队 Tile、联赛 Chip、Segmented 去边框，未选中不再满屏描边；选中只保留柔金底与 inset ring
              - 设置与引导共用同一套选择器；引导第 2 步焦点落到首个联赛选项
            - **本周 / 赛程 / 积分榜**
              - 周预算卡与三段 Tab 去边框；赛程搜索、日期导航、筛选与日期条统一为无边框表面
              - 积分榜「共 N 队」改为表格外 footer，不再遮住最后一行
            - **右栏与终场**
              - 官方平台、官方集锦、官方全场回放统一为轻量外链；终场回顾/错误态改安静表面
            - **手机端**
              - 同步暗色线框 token；Card/Chip/Segmented/Button/球队选择器完成代码层 parity
            - **无障碍**
              - 页面补唯一 `h1` 与主视图 `h2`；同开球展开按钮补 `aria-controls`，active 行补 `aria-current`
            - **验证**
              - 离线套件 1110/1110、真实 dist 渲染冒烟 81/81、对比度 32/32
              - 布局 1120 / 1366 / 1440 × macOS/Windows 两套边框均无横向溢出

            > 手机端 APK 不随桌面 Release 自动上传；如需 Android 安装包，请使用 EAS 预览构建。桌面与手机端各自保存本地数据，互不覆盖。

            ### 下载
            - **Windows x64**：`NightOwl-Terrace-Setup-*.exe`
            - **macOS Apple Silicon (arm64)**：`NightOwl-Terrace-<version>-arm64.dmg`（安装包）或 `.zip`（自动更新包）

            ### Windows 安装
            1. 下载 `NightOwl-Terrace-Setup-*.exe`，双击安装（可自选目录）
            2. 首次运行如出现 SmartScreen「已保护你的电脑」：点 **更多信息 → 仍要运行**（未做代码签名，属预期行为）

            ### macOS 安装
            1. 打开 `.dmg`，把 **NightOwl Terrace** 拖入「应用程序」
            2. 首次启动若提示「无法验证开发者」：右键 App → **打开**；或到 **系统设置 → 隐私与安全性** 点「仍要打开」
            3. 若仍被拦截，可在终端执行 `xattr -dr com.apple.quarantine "/Applications/NightOwl Terrace.app"` 后再打开

            > macOS 构建使用 ad-hoc 临时签名、未做 Apple 公证；当前仅提供 Apple Silicon (arm64)，Intel Mac 暂未出包。

            ### 内置能力
            - 观赛决策（今晚之选 / 本周规划 / 睡眠档位 / 雷区预警，内置赛季快照）
            - 直播源自动抓取 + 本地流代理；官方平台直达；粘贴直链播放

  build-macos:
    # mac 构建依赖 Windows 任务先创建 Release，避免两个任务同时创建同一 tag 的 Release。
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build frontend
        run: npm run build

      - name: Run tests
        shell: bash
        run: npm run test:all

      # package.json 里 mac.target 固定 arm64（Apple Silicon）；identity=null 跳过正式签名，
      # 由 build/after-pack.cjs 做 ad-hoc 签名，否则 arm64 机器连本机都无法启动。
      - name: Package macOS (DMG + ZIP)
        shell: bash
        run: npx electron-builder --mac --publish never -c.extraMetadata.version="$VERSION"

      - name: Verify packaged files
        run: node tools/verify-package.mjs "release/mac-arm64/NightOwl Terrace.app/Contents/Resources/app"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: nightowl-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.blockmap
          if-no-files-found: error

      # 只追加 macOS 资产，不改写 Windows 任务写好的 Release 说明；
      # gh 由 GitHub-hosted runner 自带，避免两个 publish action 并发创建 Release。
      - name: Publish macOS assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release/*.dmg \
            release/*.dmg.blockmap \
            release/*.zip \
            release/*.zip.blockmap \
            release/latest-mac.yml \
            --clobber
