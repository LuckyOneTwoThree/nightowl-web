name: build-windows

# 夜猫看台 · Windows 桌面包
#
# 触发方式：
#   1. Actions 页面手动 Run workflow（workflow_dispatch）
#   2. 推送 v* 标签（正式发版）
#
# 产物：NSIS 安装包（NightOwl-Terace-Setup-<version>.exe），在 Artifact 里下载。
# 说明：本地单机应用、不对外分发，**不做代码签名** —— Windows SmartScreen 会提示
#       「未知发布者」，属预期行为；给用户的话术是「仍要运行」。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        # 打包前先证明代码是好的；scraper 两项依赖外网，
        # 在 CI 环境不稳定，单独放行（test:all 里它们排最后，失败不影响前面的验证）
        shell: bash
        run: |
          npm run verify:algo
          npm run test:m3u8
          npm run test:proxy
          npm run test:proxy-timeout
          npm run test:playback
          npm run test:media
          npm run test:scraper-match
          npm run test:session
          npm run test:scores
          npm run test:owl
          npm run test:alias
          npm run test:stats

      - name: Package Windows (NSIS)
        run: npx electron-builder --win --publish never

      # 打包后自检：关键服务文件必须都在 resources/app 里。
      # 曾出现过「安装后 scores.js 消失」（疑似杀软隔离）—— 若打包环节就缺文件，
      # 在这里立刻失败，而不是让用户装完才发现。
      - name: Verify packaged files
        shell: pwsh
        run: |
          $required = @(
            'resources/app/electron/main.cjs',
            'resources/app/server/index.js',
            'resources/app/server/proxy.js',
            'resources/app/server/scores.js',
            'resources/app/server/scraper.js',
            'resources/app/server/m3u8.js',
            'resources/app/server/rules.json',
            'resources/app/src/data/fixtures.json',
            'resources/app/dist/index.html'
          )
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path "release/win-unpacked/$f")) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Error "打包产物缺失: $($missing -join ', ')"
            exit 1
          }
          Write-Host "✓ 打包产物完整（$($required.Count) 个关键文件齐全）"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: nightowl-windows-setup
          path: release/*.exe
          if-no-files-found: error

      # tag 触发时把安装包发布成 **GitHub Release**：
      # Artifact 只有登录且有权的人能下载，Release 附件任何人（免登录）都能下 ——
      # 「其他用户拿安装包」必须走这里，Artifact 只作为构建产物备份。
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          body: |
            ## 夜猫看台 · Windows 安装包

            ### 安装
            1. 下载下方 `NightOwl-Terrace-Setup-*.exe`，双击安装（可自选目录）
            2. 首次运行如出现 SmartScreen「已保护你的电脑」：点 **更多信息 → 仍要运行**（未做代码签名，属预期行为）

            ### 内置能力
            - 观赛决策（今晚之选 / 本周规划 / 睡眠档位 / 雷区预警，内置赛季快照）
            - 直播源自动抓取 + 本地流代理；官方平台直达；粘贴直链播放
