name: ci

# 日常提交与 PR 质量门禁：在打发版 tag 之前先拦下核心算法、服务端、前端构建、Lint 与移动端类型退化。

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  desktop-and-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 无头 Electron 渲染/布局门禁需要的系统库与虚拟显示。
      # ubuntu-24.04 的库带 t64 后缀，22.04 用旧名——两套包名依次尝试。
      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libgtk-3-0t64 libgbm1 libasound2t64 libxss1 libxtst6 libsecret-1-0 \
          || sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgtk-3-0 libgbm1 libasound2 libxss1 libxtst6 libsecret-1-0

      # L1 推荐池按「未来 6 周」生成：不重跑就会在供给耗尽后让 test:recs 无代码变更也红。
      # 必须排在 build 之前 —— 推荐数据会被打进 dist，晚于构建等于没生成（与发版工作流一致）。
      # 固定 --now 为提交时刻（北京墙钟）：Win/mac 两 job 与跨日重跑生成同一份池，
      # 避免 Date.now() 让同一 tag 的两个包内嵌不同推荐数据
      - name: Rebuild L1 recommendations
        run: npm run build:recs -- --now="$(TZ=Asia/Shanghai git log -1 --date=format:%Y-%m-%dT%H:%M --format=%cd)"

      - name: Build production bundle
        run: npm run build

      - name: Run test:all (units + secrets + biome lint)
        run: npm run test:all

      # v0.1.25 曾「构建与 Node 测试全过、生产首屏黑屏」——渲染门禁必须守合并，不能只守发版。
      - name: Render smoke (headless Electron, real dist)
        env:
          ELECTRON_DISABLE_SANDBOX: 1
        run: xvfb-run -a npm run check:render

      - name: Layout gate (no horizontal overflow)
        env:
          ELECTRON_DISABLE_SANDBOX: 1
        run: xvfb-run -a npm run check:layout

  mobile-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      # mobile check 的 lint 门禁跑根目录 Biome，需要根 node_modules；
      # 跳过 Electron 二进制下载（mobile job 不需要桌面运行时）
      - name: Install root dependencies (for Biome lint gate)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Verify shared pipeline & TypeScript
        run: npm run check
        working-directory: mobile
